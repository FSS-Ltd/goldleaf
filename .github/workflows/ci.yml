name: CI and deploy

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_CONTACT_EMAIL: ${{ secrets.NEXT_PUBLIC_CONTACT_EMAIL }}
      ENQUIRY_TO_EMAIL: ${{ secrets.ENQUIRY_TO_EMAIL }}
      ENQUIRY_FROM_EMAIL: ${{ secrets.ENQUIRY_FROM_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Build first: it generates the route types (LayoutProps, PageProps) that typecheck needs.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
        env:
          # The e2e dry run needs no key. Leave Resend unset so no real email is sent from CI.
          RESEND_API_KEY: ""
          GOLDLEAF_OFFER_DATABASE_URL: ""

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: goldleaf_test
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d goldleaf_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify onboarding database
        env:
          PGPASSWORD: local-test-only
          PGUSER: postgres
        run: |
          psql -X -h 127.0.0.1 -p 55439 -d goldleaf_test -v ON_ERROR_STOP=1 \
            -f db/tests/onboarding-upgrade.sql -f db/tests/onboarding.sql \
            -f db/migrations/0004_staff_onboarding.sql -f db/tests/staff-onboarding.sql \
            -f db/tests/invoice-upgrade-before.sql -f db/migrations/0005_invoice_billing.sql \
            -f db/tests/invoice-upgrade-after.sql -f db/tests/invoice-billing.sql \
            -f db/migrations/0006_portal_access.sql -f db/tests/portal-access.sql \
            -f db/migrations/0007_invitation_delivery.sql -f db/tests/invitation-delivery.sql \
            -f db/migrations/0008_invoice_runtime.sql -f db/tests/invoice-runtime.sql \
            -f db/migrations/0009_staff_access.sql -f db/tests/staff-access.sql \
            -f db/migrations/0010_staff_delivery.sql -f db/tests/staff-delivery.sql \
            -f db/migrations/0011_invoice_ui.sql -f db/migrations/0012_children_sessions.sql \
            -f db/migrations/0013_learning_updates.sql \
            -f db/tests/learning-foundation.sql \
            -f db/migrations/0015_messages.sql -f db/migrations/0016_portal_events.sql \
            -f db/tests/messages.sql \
            -f db/migrations/0017_message_views.sql -f db/migrations/0018_portal_invalidation.sql \
            -f db/tests/message-views.sql -f db/tests/portal-invalidation.sql
          # A fresh backend ensures the temporary-type attack tests initial function compilation.
          psql -X -h 127.0.0.1 -p 55439 -d goldleaf_test -v ON_ERROR_STOP=1 \
            -f db/tests/onboarding-grants.sql
          sh db/tests/onboarding-concurrency.sh 127.0.0.1 goldleaf_test
          sh db/tests/invitation-delivery-concurrency.sh 127.0.0.1 goldleaf_test
          sh db/tests/staff-delivery-concurrency.sh 127.0.0.1 goldleaf_test
          sh db/tests/learning-concurrency.sh 127.0.0.1 goldleaf_test
          sh db/tests/messages-concurrency.sh 127.0.0.1 goldleaf_test
          sh db/tests/message-view-concurrency.sh 127.0.0.1 goldleaf_test
          sh db/tests/portal-invalidation-concurrency.sh 127.0.0.1 goldleaf_test
          sh db/tests/events-notify.sh 127.0.0.1 goldleaf_test
          sh db/tests/invoice-concurrency.sh 127.0.0.1 goldleaf_test
          sh db/tests/invoice-runtime-concurrency.sh 127.0.0.1 goldleaf_test
          createdb -h 127.0.0.1 -p 55439 goldleaf_invoice_ui
          psql -X -h 127.0.0.1 -p 55439 -d goldleaf_invoice_ui -v ON_ERROR_STOP=1 \
            -f db/tests/onboarding-upgrade.sql -f db/migrations/0004_staff_onboarding.sql \
            -f db/migrations/0005_invoice_billing.sql -f db/migrations/0006_portal_access.sql \
            -f db/migrations/0007_invitation_delivery.sql -f db/migrations/0008_invoice_runtime.sql \
            -f db/migrations/0009_staff_access.sql -f db/migrations/0010_staff_delivery.sql \
            -f db/tests/invoice-ui-upgrade-before.sql \
            -f db/migrations/0011_invoice_ui.sql -f db/tests/invoice-ui.sql
          sh db/tests/invoice-ui-concurrency.sh 127.0.0.1 goldleaf_invoice_ui
          createdb -h 127.0.0.1 -p 55439 goldleaf_migration_race
          sh db/tests/staff-migration-concurrency.sh 127.0.0.1 goldleaf_migration_race

  deploy:
    needs: [test, database]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fail early if the Vercel token is missing
        run: test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN secret is not set"; exit 1; }
      - name: Pull Vercel settings
        run: pnpm dlx vercel@latest pull --yes --environment=${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }} --token="$VERCEL_TOKEN"
      - name: Build
        run: pnpm dlx vercel@latest build ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} --token="$VERCEL_TOKEN"
      - name: Deploy
        id: deploy
        run: |
          url=$(pnpm dlx vercel@latest deploy --prebuilt ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Comment the preview URL on the open pull request
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --head "${{ github.ref_name }}" --json number --jq '.[0].number')
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --body "Preview deployed: ${{ steps.deploy.outputs.url }}"
          fi
